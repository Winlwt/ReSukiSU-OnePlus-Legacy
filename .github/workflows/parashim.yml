name: Build parashim shim (5.15 -> 5.4)

# 给 paradise_5.15.ko 补 5.4 上缺失的 13 个符号
# 做法：先跑正常的内核编译（为拿 Module.symvers / CRC），
#       再用同一个 out/ 目录 out-of-tree 编 parashim.ko

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      ROM: coloros
      KBUILD_MODPOST_WARN: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve model from branch
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          selector = Path("device.json")
          if not selector.exists():
              raise SystemExit("Select a oneplus-* model branch, not main")
          device = json.loads(selector.read_text())["device"]
          if device != os.environ["BRANCH"]:
              raise SystemExit("Device selector does not match branch")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("DEVICE=" + device + "\n")
          PY

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-14 llvm-14 lld-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi build-essential bc bison flex libssl-dev libelf-dev libtinfo5 protobuf-c-compiler libprotobuf-c-dev dwarves python3
          echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"

      - name: Compile kernel (for Module.symvers)
        run: python3 scripts/build.py --device "$DEVICE" --os "$ROM"

      - name: Locate kernel work tree
        run: |
          set -e
          WORK=$(ls -d .work/*/ | head -1)
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "found: $WORK"
          test -f "${WORK}kernel/msm-5.4/Makefile"
          test -d "${WORK}obj"
          if [ -f "${WORK}obj/Module.symvers" ]; then
            echo "Module.symvers: $(wc -l < "${WORK}obj/Module.symvers") 行"
          else
            echo "::warning::Module.symvers 不存在，parashim 的 __versions 会全是 0（后面会清空该段）"
          fi

      - name: Build parashim.ko
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/${WORK}kernel/msm-5.4"
          OUT="$GITHUB_WORKSPACE/${WORK}obj"
          make -C "$SRC" O="$OUT" ARCH=arm64 \
            CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            M="$GITHUB_WORKSPACE/parashim" modules
          ls -l parashim/

      - name: Patch module (empty __versions, report layout)
        run: |
          python3 - <<'PY'
          import struct, hashlib, sys

          def sections(buf):
              shoff = struct.unpack_from("<Q", buf, 0x28)[0]
              esz = struct.unpack_from("<H", buf, 0x3a)[0]
              n = struct.unpack_from("<H", buf, 0x3c)[0]
              si = struct.unpack_from("<H", buf, 0x3e)[0]
              out = []
              for i in range(n):
                  o = shoff + i * esz
                  nm, typ, fl, addr, off, size, link, info, al, e2 = struct.unpack_from(
                      "<IIQQQQIIQQ", buf, o)
                  out.append(dict(o=o, nm=nm, typ=typ, off=off, size=size))
              so, ss = out[si]["off"], out[si]["size"]
              strb = bytes(buf[so:so + ss])
              for s in out:
                  s["name"] = strb[s["nm"]:].split(b"\0", 1)[0].decode("latin1")
              return out

          p = "parashim/parashim.ko"
          d = bytearray(open(p, "rb").read())
          assert d[0:4] == b"\x7fELF" and d[4] == 2, "不是 ELF64"

          for s in sections(d):
              if s["name"] == "__versions" and s["size"] > 0:
                  print("__versions size=%d (%.0f 条) -> 置 0" % (s["size"], s["size"] / 64.0))
                  struct.pack_into("<Q", d, s["o"] + 0x20, 0)
          open(p, "wb").write(bytes(d))

          d = open(p, "rb").read()
          info = {s["name"]: s for s in sections(d)}
          tm = info.get(".gnu.linkonce.this_module")
          rela = info.get(".rela.gnu.linkonce.this_module")
          offs = [struct.unpack_from("<Q", d, rela["off"] + k * 24)[0]
                  for k in range(rela["size"] // 24)] if rela else []
          tm_size = tm["size"] if tm else None
          print("this_module = %s" % tm_size)
          print("rela        = %s" % ["0x%x" % x for x in offs])
          print("size        = %d" % len(d))
          print("sha256      = %s" % hashlib.sha256(d).hexdigest())
          if tm_size != 896 or offs != [0x178, 0x338]:
              print("::error::布局不是 896/0x178/0x338")
              sys.exit(1)
          PY

      - name: Verify exports and vermagic
        run: |
          set -e
          python3 - <<'PY'
          import re, subprocess, sys
          need = ["_printk","close_fd","gic_nonsecure_priorities",
                  "__mmap_lock_do_trace_start_locking",
                  "__mmap_lock_do_trace_acquire_returned",
                  "__mmap_lock_do_trace_released",
                  "__tracepoint_mmap_lock_start_locking",
                  "__tracepoint_mmap_lock_acquire_returned",
                  "__tracepoint_mmap_lock_released",
                  "__alloc_pages","kasan_flag_enabled","__cfi_slowpath_diag","__find_vma"]
          ko = "parashim/parashim.ko"
          out = subprocess.run(["llvm-nm","-g","--defined-only",ko],
                               capture_output=True, text=True).stdout
          have = set(re.findall(r"\b([A-Za-z_][A-Za-z0-9_]*)$", out, re.M))
          miss = [s for s in need if s not in have]
          print("导出目标符号: %d / %d" % (len(need)-len(miss), len(need)))
          if miss:
              print("::error::缺少导出: " + ", ".join(miss))
              sys.exit(1)
          d = open(ko,"rb").read()
          print("vermagic:", set(re.findall(rb"vermagic=[^\x00]{0,90}", d)))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: parashim
          path: parashim/parashim.ko
          if-no-files-found: error
